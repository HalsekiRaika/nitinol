syntax = "proto3";

package nitinol.saga.consumed;

// The position of an upstream record the saga has consumed.  Persisted on the
// saga's own EventStore stream — in the append that closes out the `handle`
// decision its input produced (the last one, when a single `handle` call
// reaches the store as more than one atomic append), or in the position-only
// append that settles an input `handle` refused — and classified back as
// `SagaPersisted::Consumed`.
//
// The position names the source stream it belongs to rather than standing for
// the subscription as a whole, so a saga reading several upstream streams holds
// one position per stream and a record of one source can never be read as
// covering another.
message ConsumedMarker {
  oneof kind {
    Consumed consumed = 1;
  }
}

// One source's position: the highest sequence of `source` the saga has
// consumed on its own stream.
message Consumed {
  // Stream key of the upstream source the position belongs to.
  string source = 1;
  // Highest sequence of that source the saga has consumed.
  uint64 sequence = 2;
  // Canonical path of the declared source's event type.
  //
  // Two declared sources can be written on one stream key — an aggregate
  // emitting two event types, a saga observing another saga's stream — so the
  // stream key alone does not name what a position settled: the higher of the
  // two positions would cover the other source's records.
  //
  // Never empty.  An empty one used to mean "a row from before sources were
  // named", read as covering every source of its stream; no reader for such a
  // row is kept, so an empty source is a corrupted payload and the load
  // refuses it.
  string source_event_type = 3;
}
