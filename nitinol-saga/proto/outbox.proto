syntax = "proto3";

package nitinol.saga.outbox;

message OutboxMarker {
  oneof kind {
    TellRequested tell_requested = 1;
    TellAcked tell_acked = 2;
    TellFailed tell_failed = 3;
    Scheduled scheduled = 4;
  }
}

message TellRequested {
  uint64 tell_id = 1;
  optional bytes crash_restart = 2;
}

message TellAcked {
  uint64 tell_id = 1;
}

message TellFailed {
  uint64 tell_id = 1;
}

message Scheduled {
  int64 at_unix_seconds = 1;
}
