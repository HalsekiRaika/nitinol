[package]
name = "nitinol-saga"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Event-sourced process manager (Saga) for nitinol"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
jiff = "0.2"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1"
nitinol-runtime = { path = "../nitinol-runtime" }
nitinol-persistence = { path = "../nitinol-persistence" }
nitinol-eventsource = { path = "../nitinol-eventsource" }

# `protox` parses the `.proto` schema in pure Rust so codegen needs no system
# `protoc`. Pinned to the 0.13-compatible line to share prost with the runtime
# dependency above (avoids a duplicate prost version in the tree).
[build-dependencies]
protox = "0.8"
prost-build = "0.13"

[dev-dependencies]
bytes = "1"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nitinol-eventsource = { path = "../nitinol-eventsource", features = ["test-helpers"] }
