[package]
name = "nitinol-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Derive macros for nitinol event sourcing"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"
# The reserved-namespace law lives in `nitinol-persistence` and is enforced in
# two spaces; the derive reads the same constant and predicate the identifier
# constructors do rather than restating the boundary here.
nitinol-persistence = { path = "../nitinol-persistence" }

[dev-dependencies]
trybuild = "1"
nitinol = { path = "..", features = ["eventsource"] }
