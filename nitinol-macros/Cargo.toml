[package]
name = "nitinol-macros"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Derive macros for nitinol event sourcing"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"
# The reserved-namespace law is part of the event identity `nitinol-contract`
# defines, and is enforced in two spaces; the derive reads the same constant and
# predicate the identifier constructors do rather than restating the boundary
# here.
nitinol-contract = { path = "../nitinol-contract", version = "0.6.1" }
# The uniqueness symbol a derived declaration exports belongs to the machinery
# that collects declarations, so its prefix and byte set are read from there.
nitinol-persistence = { path = "../nitinol-persistence", version = "0.6.1" }

[dev-dependencies]
trybuild = "1"
# The `saga` feature carries the `SagaSubscribe` trait and the `Deadline`
# surface the alphabet fixtures name; `eventsource` carries `Event`.
nitinol = { path = "..", features = ["eventsource", "saga"] }
# `Event` names the codec that writes it, so every fixture that derives `Event`
# must also name a `Codec`, whose signature is stated in `Bytes`. The framework
# ships no codec implementation of its own (it stays serde-free), so the
# fixtures write their own.
bytes = "1"

[lints]
workspace = true
