[package]
name = "nitinol-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Derive macros for nitinol event sourcing"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
nitinol = { path = "..", features = ["eventsource"] }
