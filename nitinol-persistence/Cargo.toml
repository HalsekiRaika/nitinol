[package]
name = "nitinol-persistence"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Persistence abstractions for nitinol event sourcing"

# The library is a benchmark target too, and libtest's harness is what runs it,
# so a plain `cargo bench -p nitinol-persistence -- --save-baseline <name>` hands
# criterion's arguments to libtest, which rejects them outright. Nothing in the
# library is a benchmark, so switching its target off leaves `--` to criterion.
[lib]
bench = false

[dependencies]
# The event identity a stored row carries is defined by the contract, as part
# of what a domain promises the machinery; this crate re-exports it as the shape
# of its rows and owns the machinery that collects and restores it.
nitinol-contract = { path = "../nitinol-contract", version = "0.6.1" }
bytes = "1"
jiff = "0.2"
futures-core = "0.3"
async-trait = "0.1"
thiserror = "2"
# The event types a binary can restore are gathered by the linker rather than
# registered by hand: `EVENT_REGISTRY` is the slice every declaration places its
# entry in. Native targets only — `link_section` is what this rests on.
linkme = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
criterion = { workspace = true }

[[bench]]
name = "in_memory_event_store"
harness = false

[lints]
workspace = true
