[package]
name = "nitinol-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Runtime-free contract traits between nitinol and downstream domain code"

# The point of this crate is what it may *not* depend on: an async runtime, and
# any other part of nitinol.  The event identity a domain promises the machinery
# is defined here, so the machinery depends on the contract and never the other
# way round — `nitinol-persistence` re-exports the identity types.
[dependencies]
# The codec signature is stated in `Bytes`, the same currency the persistence
# layer's payloads are in.  A byte buffer is not an async runtime.
bytes = "1"

[lints]
workspace = true
