[package]
name = "nitinol-store-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Executable conformance suites for the contracts any nitinol EventStore, SnapshotStore and CheckpointStore owes"

# The point of this crate is what it may *not* depend on: an async runtime.  A
# kit that reached for one would be out of reach of every provider built on
# another, so whichever runtime you await the suite on stays the caller's choice
# and `tokio` appears here as a dev-dependency only.
[dependencies]
nitinol-persistence = { path = "../nitinol-persistence" }
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = "0.2"

# `async-trait` is a dev-dependency because the kit itself implements none of
# the store traits: only the fault-injecting doubles under `tests/` do.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
