[package]
name = "nitinol-conformance"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Executable conformance suite for the laws any interpreter of the nitinol contract owes"

# The point of this crate is what it may *not* depend on: an interpreter, or the
# async runtime one is built on.  A suite that reached for `nitinol-eventsource`
# would measure that interpreter's machinery instead of the laws every
# interpreter owes, and would be out of reach of anyone writing their own.
[dependencies]
nitinol-contract = { path = "../nitinol-contract", version = "0.6.0" }
nitinol-persistence = { path = "../nitinol-persistence", version = "0.6.0" }
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = "0.2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
