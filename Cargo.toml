[workspace]
members = [
  ".",
  "nitinol-*",
  "providers/nitinol-sqlx",
  "examples/runtime/*",
  "examples/eventsource/*",
  "examples/saga/*"
]
default-members = [
  ".",
  "nitinol-*"
]

resolver = "2"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/HalsekiRaika/dylints", rev = "9ea8108", pattern = "lints/*" },
]

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))", "cfg(tokio_unstable)"]

[workspace.lints.clippy]
manual_async_fn = "deny"

[workspace.package]
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["ReiRokusanami <reirokusanami.rdh@gmail.com>"]
repository = "https://github.com/HalsekiRaika/nitinol"
readme = "README.md"
description = "A utilities for event sourcing"

[workspace.dependencies]
# Defined once here so every crate's benchmarks are built with one version and
# one feature set. `default-features = false` drops `plotters` and `rayon`: the
# measurements are read from the terminal and compared with `--save-baseline`,
# and the licence closure stays inside the set `deny.toml` allows.
# `cargo_bench_support` is what lets `cargo bench` run these at all, and
# `async_tokio` is what lets a benchmark await the framework's own entry points.
criterion = { version = "0.7", default-features = false, features = [
  "async_tokio",
  "cargo_bench_support",
] }

[package]
name = "nitinol"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description.workspace = true
# The umbrella's package root is the workspace root, so without this list the
# tarball would carry repo tooling (`.takt/`, `.github/`, `flake.*`, `scripts/`).
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE_APACHE",
  "LICENSE_MIT",
]

# The umbrella's root is the workspace root, so this is the one package whose
# release reaches `CHANGELOG.md`; set anywhere wider, every member's release
# would look for the heading too.
[package.metadata.release]
pre-release-replacements = [
  { file = "CHANGELOG.md", search = '## \[Unreleased\]', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# No features are enabled by default — explicit opt-in, Tokio style.
default = []
runtime = ["dep:nitinol-runtime"]
persistence = ["dep:nitinol-persistence"]
# The runtime-free contract layer: the aggregate traits and `#[derive(Event)]`,
# and nothing that would pull in Tokio.
contract = ["dep:nitinol-contract", "dep:nitinol-macros", "dep:linkme", "persistence"]
eventsource = ["dep:nitinol-eventsource", "dep:nitinol-macros", "contract", "runtime", "persistence"]
saga = ["dep:nitinol-saga", "runtime", "persistence", "eventsource"]
# A storage backend rather than a layer of the framework, so it stays out of
# `full`: what that feature means is every part of nitinol, not a database
# driver and the connections it opens.
postgres = ["dep:nitinol-sqlx", "nitinol-sqlx/postgres", "persistence"]
full = ["runtime", "persistence", "contract", "eventsource", "saga"]

[dependencies]
nitinol-contract = { path = "nitinol-contract", version = "0.6.0", optional = true }
nitinol-runtime = { path = "nitinol-runtime", version = "0.6.0", optional = true }
nitinol-persistence = { path = "nitinol-persistence", version = "0.6.0", optional = true }
nitinol-eventsource = { path = "nitinol-eventsource", version = "0.6.0", optional = true }
nitinol-saga = { path = "nitinol-saga", version = "0.6.0", optional = true }
nitinol-macros = { path = "nitinol-macros", version = "0.6.0", optional = true }
nitinol-sqlx = { path = "providers/nitinol-sqlx", version = "0.6.0", optional = true }
# Reached only by the code `#[derive(Event)]` writes, through
# `nitinol::__private::linkme`: deriving `Event` places an entry in the event
# registry's collection slice, and a user is obliged to depend on `nitinol`
# alone.
linkme = { version = "0.3", optional = true }

[dev-dependencies]
# Required by the `#[tokio::test]` attribute in umbrella integration tests.
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
nitinol-persistence = { path = "nitinol-persistence" }
# `Codec` is stated in `Bytes`, so a test fixture that names a codec spells it.
bytes = "1"
# A path the facade must not export can only be checked by failing to compile.
trybuild = "1"

# Line tables are enough for a backtrace with file and line; full debug info
# makes every test binary and every link larger for nothing the tests use.
# `profile.test` inherits from `profile.dev`.
[profile.dev]
debug = "line-tables-only"
