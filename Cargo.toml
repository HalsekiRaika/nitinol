[workspace]
members = [
  ".",
  "nitinol-*",
  "examples/runtime/*"
]
default-members = [
  ".",
  "nitinol-*"
]

resolver = "2"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/HalsekiRaika/dylints", rev = "cba0f0d", pattern = "lints/*" },
]

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ReiRokusanami <reirokusanami.rdh@gmail.com>"]
repository = "https://github.com/HalsekiRaika/nitinol"
description = "A utilities for event sourcing"

[workspace.dependencies]

[features]

[package]
name = "nitinol"
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ReiRokusanami <reirokusanami.rdh@gmail.com>"]
repository = "https://github.com/HalsekiRaika/nitinol"
description = "A utilities for event sourcing"

[dependencies]
