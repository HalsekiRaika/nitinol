[workspace]
members = [
  ".",
  "nitinol-*",
  "examples/runtime/*",
  "examples/eventsource/*",
  "examples/saga/*"
]
default-members = [
  ".",
  "nitinol-*"
]

resolver = "2"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/HalsekiRaika/dylints", rev = "cba0f0d", pattern = "lints/*" },
]

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ReiRokusanami <reirokusanami.rdh@gmail.com>"]
repository = "https://github.com/HalsekiRaika/nitinol"
description = "A utilities for event sourcing"

[workspace.dependencies]

[package]
name = "nitinol"
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ReiRokusanami <reirokusanami.rdh@gmail.com>"]
repository = "https://github.com/HalsekiRaika/nitinol"
description = "A utilities for event sourcing"

[features]
# No features are enabled by default — explicit opt-in, Tokio style.
default = []
runtime = ["dep:nitinol-runtime"]
persistence = ["dep:nitinol-persistence"]
eventsource = ["dep:nitinol-eventsource", "runtime", "persistence"]
saga = ["dep:nitinol-saga", "runtime", "persistence", "eventsource"]
full = ["runtime", "persistence", "eventsource", "saga"]

[dependencies]
nitinol-runtime = { path = "nitinol-runtime", optional = true }
nitinol-persistence = { path = "nitinol-persistence", optional = true }
nitinol-eventsource = { path = "nitinol-eventsource", optional = true }
nitinol-saga = { path = "nitinol-saga", optional = true }

[dev-dependencies]
# Required by the `#[tokio::test]` attribute in umbrella integration tests.
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
nitinol-persistence = { path = "nitinol-persistence" }
