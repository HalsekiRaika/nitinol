name: rust-quality-repair-script
description: |
  canonical rust-quality.sh自体の欠陥を修復するquality recovery workflow。
  製品側のquality failureを隠す変更は禁止する。

max_steps: 10
initial_step: repair

steps:
  - name: repair
    tags:
      - coding
      - fix
      - rust
      - quality-recovery
      - rust-quality-script
    edit: true
    persona: coder
    session_key: rust-quality-repair-script
    session: refresh
    policy:
      - coding
      - rust-quality-recovery
    required_permission_mode: edit
    provider_options:
      claude:
        effort: high
        allowed_tools:
          - Read
          - Glob
          - Grep
          - Edit
          - Write
          - Bash
          - WebSearch
          - WebFetch
    instruction: rust-quality-repair-script
    quality_gates:
      - type: command
        name: rust-quality-script-syntax
        command: bash -n ./.takt/quality-gates/rust-quality.sh
        cwd: .
        timeout_ms: 60000
    rules:
      - condition: canonical scriptの欠陥修復が完了した
        next: review
      - condition: 欠陥はscriptではなく製品または環境側にある
        next: ABORT
      - condition: ユーザーの方針決定が必要
        next: repair
        requires_user_input: true
        interactive_only: true

  - name: review
    tags:
      - review
      - coding
      - rust
      - quality-recovery
      - rust-quality-script
    edit: false
    persona: coding-reviewer
    session_key: rust-quality-repair-script-review
    session: refresh
    policy:
      - review
      - coding
      - rust-quality-recovery
    pass_previous_response: false
    instruction: rust-quality-repair-review
    rules:
      - condition: script修復は妥当で、品質基準を弱めていない
        next: COMPLETE
      - condition: script変更に修正可能な問題がある
        next: repair
      - condition: 品質基準の方針決定が必要
        next: ABORT
