name: default
description: テスト先行開発ワークフロー（計画 → テスト作成 → draft（実装 + AI 自己レビュー） → peer-review（専門レビュー + merge-readiness + supervise） → COMPLETE）
max_steps: 30
initial_step: plan
steps:
  - name: plan
    tags:
      - plan
      - route-provider-network
      - route-claude-tools-read
    edit: false
    persona: planner
    knowledge: architecture
    rules:
      - condition: 要件が明確で実装可能
        next: write_tests
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 要件が不明確、情報不足
        next: ABORT
        appendix: |
          確認事項:
          - {質問1}
          - {質問2}
    instruction: plan
    output_contracts:
      report:
        - name: plan.md
          format: plan
    policy:
      - report-phase-boundary
  - name: write_tests
    tags:
      - coding
      - test-planning
      - route-provider-network
      - route-claude-tools-edit
    edit: true
    persona: coder
    policy:
      - coding
      - testing
      - report-phase-boundary
    knowledge:
      - architecture
      - unit-testing
      - e2e-testing
    required_permission_mode: edit
    instruction: write-tests-first
    rules:
      - condition: テスト作成が完了した
        next: draft
      - condition: テスト対象が未実装のためテスト作成をスキップする
        next: draft
      - condition: テスト作成を進行できない
        next: ABORT
      - condition: ユーザーへの確認事項があるためユーザー入力が必要
        next: write_tests
        requires_user_input: true
        interactive_only: true
    output_contracts:
      report:
        - name: test-report.md
          format: test-report
  - name: draft
    kind: workflow_call
    call: default-draft
    args:
      impl_instruction: implement-after-tests
    rules:
      - condition: COMPLETE
        next: peer-review
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT
  - name: peer-review
    kind: workflow_call
    call: default-peer-review
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT
