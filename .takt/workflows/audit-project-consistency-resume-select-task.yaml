name: audit-project-consistency-resume-select-task
description: |
  既存のproject consistency auditレポートを再利用し、
  select_taskと対象Workflowへのenqueueだけを実行する回復用workflow。

max_steps: 3
initial_step: collect_queue_context

steps:
  - name: collect_queue_context
    mode: system
    system_inputs:
      - type: task_queue_context
        source: current_project
        as: queue
        exclude_current_task: true
    rules:
      - condition: when(true)
        next: select_task

  - name: select_task
    tags:
      - plan
      - queue
      - consistency
      - project-consistency-gpt-structured
    edit: false
    persona: project-consistency-task-selector
    session_key: project-consistency-select-task-recovery
    session: refresh
    policy:
      - project-consistency-task-selection
      - report-phase-boundary
    instruction: project-consistency-select-task
    structured_output:
      schema_ref: project-consistency-followup-task
    output_contracts:
      report:
        - name: 05-project-consistency-task-selection.md
          format: project-consistency-task-selection
    rules:
      - condition: when(structured.select_task.action == "wait_before_next_scan" && structured.select_task.decision_reason_code != "task_selected" && structured.select_task.decision_reason != "" && structured.select_task.next_scan_condition != "")
        next: COMPLETE
      - condition: when(structured.select_task.action == "wait_before_next_scan")
        next: ABORT
      - condition: when(structured.select_task.workflow_target == "default-rust")
        next: enqueue_default_rust
      - condition: when(structured.select_task.workflow_target == "rust-quality-repair-fmt")
        next: enqueue_quality_fmt
      - condition: when(structured.select_task.workflow_target == "rust-quality-repair-clippy")
        next: enqueue_quality_clippy
      - condition: when(structured.select_task.workflow_target == "rust-quality-repair-dylint")
        next: enqueue_quality_dylint
      - condition: when(structured.select_task.workflow_target == "rust-quality-repair-test")
        next: enqueue_quality_test
      - condition: when(structured.select_task.workflow_target == "rust-quality-repair-structural")
        next: enqueue_quality_structural
      - condition: when(structured.select_task.workflow_target == "rust-quality-repair-script")
        next: enqueue_quality_script
      - condition: when(true)
        next: ABORT

  - name: enqueue_default_rust
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: default-rust
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_default_rust.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT

  - name: enqueue_quality_fmt
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: rust-quality-repair-fmt
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_quality_fmt.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT

  - name: enqueue_quality_clippy
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: rust-quality-repair-clippy
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_quality_clippy.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT

  - name: enqueue_quality_dylint
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: rust-quality-repair-dylint
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_quality_dylint.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT

  - name: enqueue_quality_test
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: rust-quality-repair-test
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_quality_test.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT

  - name: enqueue_quality_structural
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: rust-quality-repair-structural
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_quality_structural.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT

  - name: enqueue_quality_script
    mode: system
    effects:
      - type: enqueue_task
        mode: new
        workflow: rust-quality-repair-script
        base_branch:
          name: consistency
          create_if_missing:
            from: main
            push: true
        task: "{structured:select_task.task_markdown}"
        issue: "{structured:select_task.issue}"
        worktree:
          enabled: true
          auto_pr: false
    rules:
      - condition: when(effect.enqueue_quality_script.enqueue_task.success == true)
        next: COMPLETE
      - condition: when(true)
        next: ABORT
