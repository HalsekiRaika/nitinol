[package]
name = "saga-fanout-pattern"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Official fan-out pattern: one fact event, saga manager delivery, idempotent child creation"

[[bin]]
name = "saga-fanout-pattern"
path = "src/main.rs"

[dependencies]
nitinol-saga = { path = "../../../nitinol-saga" }
nitinol-eventsource = { path = "../../../nitinol-eventsource" }
nitinol-persistence = { path = "../../../nitinol-persistence" }
nitinol-runtime = { path = "../../../nitinol-runtime" }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
futures-util = "0.3"
