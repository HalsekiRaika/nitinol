[package]
name = "eventsource-codec-switch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "JsonCodec vs pass-through codec comparison and user-defined codec example"

[lib]
name = "eventsource_codec_switch"
path = "src/lib.rs"

[[bin]]
name = "eventsource-codec-switch"
path = "src/main.rs"

[dependencies]
nitinol = { path = "../../..", features = ["eventsource"] }
nitinol-eventsource = { path = "../../../nitinol-eventsource" }
nitinol-persistence = { path = "../../../nitinol-persistence" }
nitinol-runtime = { path = "../../../nitinol-runtime" }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
