[package]
name = "eventsource-multiple-deciders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "One aggregate with multiple Decider and Query implementations"

[lib]
name = "eventsource_multiple_deciders"
path = "src/lib.rs"

[[bin]]
name = "eventsource-multiple-deciders"
path = "src/main.rs"

[dependencies]
nitinol = { path = "../../..", features = ["eventsource"] }
nitinol-eventsource = { path = "../../../nitinol-eventsource" }
nitinol-persistence = { path = "../../../nitinol-persistence" }
nitinol-runtime = { path = "../../../nitinol-runtime" }
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
