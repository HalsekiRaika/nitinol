[package]
name = "eventsource-snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Snapshotable aggregate example showing snapshot save and restore"

[lib]
name = "eventsource_snapshot"
path = "src/lib.rs"

[[bin]]
name = "eventsource-snapshot"
path = "src/main.rs"

[dependencies]
nitinol = { path = "../../..", features = ["eventsource"] }
nitinol-eventsource = { path = "../../../nitinol-eventsource" }
nitinol-persistence = { path = "../../../nitinol-persistence" }
nitinol-runtime = { path = "../../../nitinol-runtime" }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jiff = "0.2"
