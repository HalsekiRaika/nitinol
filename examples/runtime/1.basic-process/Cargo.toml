[package]
name = "basic-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

# Expose counter.rs as a library target so integration tests can import Counter.
[lib]
name = "basic_process"
path = "src/lib.rs"

[[bin]]
name = "basic-process"
path = "src/main.rs"

[dependencies]
nitinol-runtime = { path = "../../../nitinol-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
