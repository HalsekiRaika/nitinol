[package]
name = "watching"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

# Expose process modules as a library target so integration tests can import them.
[lib]
name = "watching"
path = "src/lib.rs"

[[bin]]
name = "watching"
path = "src/main.rs"

[dependencies]
nitinol-runtime = { path = "../../../nitinol-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
