[package]
name = "nitinol-eventsource"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Event sourcing runtime for nitinol: interprets the aggregate contract"

# The library is a benchmark target too, and libtest's harness is what runs it,
# so a plain `cargo bench -p nitinol-eventsource -- --save-baseline <name>` hands
# criterion's arguments to libtest, which rejects them outright. Nothing in the
# library is a benchmark, so switching its target off leaves `--` to criterion.
[lib]
bench = false

[features]
test-helpers = []

[dependencies]
nitinol-contract = { path = "../nitinol-contract" }
nitinol-runtime = { path = "../nitinol-runtime" }
nitinol-persistence = { path = "../nitinol-persistence" }
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = "0.2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The conformance suite runs as part of this crate's ordinary test run: a law
# that only holds under an opt-in configuration is not a law this crate keeps.
nitinol-conformance = { path = "../nitinol-conformance" }
criterion = { workspace = true }

[[bench]]
name = "event_source_system"
harness = false
